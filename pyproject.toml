[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-connectome"
version = "0.6.0"
description = "Experimental runtime for paired neural state, typed decisions, optional LLM reasoning, data sources, MCP, scheduling, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pyarrow>=18,<25",
  "croniter>=6,<7",
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]
browser = [
  "playwright>=1.50,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hive_connectome = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=hive_connectome --cov-branch --cov-report=term-missing --cov-fail-under=80"
