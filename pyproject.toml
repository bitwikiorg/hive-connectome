[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-connectome"
version = "0.1.0"
description = "Always-on Hivemind runtime combining connectome state, Venice Jev decisions, local AI, MCP, data sources, cron tasks, and simulations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "croniter>=6,<7",
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hive_connectome = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
